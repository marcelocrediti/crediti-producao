  apiKey: "AIzaSyCUn7aDxaVYmDpR2GGS9c0f8sPbgFOeXvk",
  authDomain: "crediti-producao.firebaseapp.com",
  projectId: "crediti-producao",
  storageBucket: "crediti-producao.firebasestorage.app",
  messagingSenderId: "486060664110",
  appId: "1:486060664110:web:d140bca30b1d3e733346bf"
};

const FIREBASE_NOT_CONFIGURED = FIREBASE_CONFIG.apiKey === "COLE_AQUI_SUA_API_KEY";
window.__FIREBASE_NOT_CONFIGURED__ = FIREBASE_NOT_CONFIGURED;

let db = null;
if (!FIREBASE_NOT_CONFIGURED) {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
}

// ---- Storage shim: implementa a mesma API (get/set/list) usando Firestore ----
function docId(key, shared) {
  return (shared ? "shared_" : "local_") + key;
}
window.storage = {
  get: function(key, shared) {
    if (!db) return Promise.reject(new Error("Firebase não configurado"));
    return db.collection("crediti_storage").doc(docId(key, shared)).get().then(function(snap) {
      if (!snap.exists) throw new Error("not found");
      return { key: key, value: snap.data().value, shared: !!shared };
    });
  },
  set: function(key, value, shared) {
    if (!db) return Promise.reject(new Error("Firebase não configurado"));
    return db.collection("crediti_storage").doc(docId(key, shared)).set({ value: value }).then(function() {
      return { key: key, value: value, shared: !!shared };
    });
  },
  delete: function(key, shared) {
    if (!db) return Promise.reject(new Error("Firebase não configurado"));
    return db.collection("crediti_storage").doc(docId(key, shared)).delete().then(function() {
      return { key: key, deleted: true, shared: !!shared };
    });
  },
  list: function(prefix, shared) {
    if (!db) return Promise.reject(new Error("Firebase não configurado"));
    const fullPrefix = docId(prefix || "", shared);
    return db.collection("crediti_storage")
      .where(firebase.firestore.FieldPath.documentId(), ">=", fullPrefix)
      .where(firebase.firestore.FieldPath.documentId(), "<", fullPrefix + "\uf8ff")
      .get()
      .then(function(snap) {
        const stripLen = (shared ? "shared_" : "local_").length;
        const keys = [];
        snap.forEach(function(doc) { keys.push(doc.id.slice(stripLen)); });
        return { keys: keys, prefix: prefix, shared: !!shared };
      });
  }
};
</script>

function parseNum(v) {
  if (v === "" || v === null || v === undefined) return 0;
  if (typeof v === "number") return v;
  const cleaned = String(v).replace(/[R$\s]/g, "").replace(/\./g, "").replace(",", ".");
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function formatBRL(v) {
  return parseNum(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function initials(name) { return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase(); }
function fmtDate(d) {
  if (!d) return "";
  const iso = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  return d;
}
function maskDateInput(v) {
  const digits = v.replace(/\D/g, "").slice(0, 8);
  if (digits.length > 4) return digits.slice(0, 2) + "/" + digits.slice(2, 4) + "/" + digits.slice(4);
  if (digits.length > 2) return digits.slice(0, 2) + "/" + digits.slice(2);
  return digits;
}
function maskCPF(v) {
  const digits = v.replace(/\D/g, "").slice(0, 11);
  if (digits.length > 9) return digits.slice(0, 3) + "." + digits.slice(3, 6) + "." + digits.slice(6, 9) + "-" + digits.slice(9);
  if (digits.length > 6) return digits.slice(0, 3) + "." + digits.slice(3, 6) + "." + digits.slice(6);
  if (digits.length > 3) return digits.slice(0, 3) + "." + digits.slice(3);
  return digits;
}
function maskPhone(v) {
  const digits = v.replace(/\D/g, "").slice(0, 11);
  if (!digits) return "";
  const ddd = digits.slice(0, 2);
  const rest = digits.slice(2);
  let out = "(" + ddd + (digits.length > 2 ? ") " : "");
  if (rest.length > 5) out += rest.slice(0, 5) + "-" + rest.slice(5, 9);
  else out += rest;
  return out;
}
function maskCurrency(v) {
  const digits = v.replace(/\D/g, "");
  if (!digits) return "";
  const value = parseInt(digits, 10) / 100;
  return value.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function computeBaseYears() {
  const nowYear = new Date().getFullYear();
  const start = 2025;
  const end = Math.max(nowYear, 2026);
  const years = [];
  for (let y = start; y <= end; y++) years.push(y);
  return years;
}

async function safeGet(key, shared) { try { return await window.storage.get(key, shared); } catch (e) { return null; } }
async function safeSet(key, value, shared) { try { return await window.storage.set(key, value, shared); } catch (e) { return null; } }
async function safeList(prefix, shared) { try { return await window.storage.list(prefix, shared); } catch (e) { return null; } }

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.setTextColor(23, 22, 15);
    doc.text("Crediti Soluções Financeiras", 94, 42);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(90, 87, 68);
    doc.text("Rua Dom Aureliano Matos, 1741 — Loja A — Centro — Itapajé/CE", 94, 55);
    doc.setDrawColor(23, 22, 15);
    doc.setLineWidth(1.2);
    doc.line(40, 80, pageWidth - 40, 80);
    return 100;
  }

  function pdfTitle(doc, text, y) {
    const pageWidth = doc.internal.pageSize.getWidth();
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11.5);
    doc.setTextColor(23, 22, 15);
    doc.text(text, 40, y);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.5);
    doc.setTextColor(140, 134, 114);
    doc.text(`Gerado em ${new Date().toLocaleDateString("pt-BR")}`, pageWidth - 40, y, { align: "right" });
    return y + 14;
  }

  function pdfSectionLabel(doc, text, y) {
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(23, 22, 15);
    doc.text(text, 40, y);
    return y + 8;
  }

  function pdfTable(doc, y, head, body, foot) {
    doc.autoTable({
      startY: y,
      head: [head],
      body: body.length ? body : [head.map((_, i) => (i === 0 ? "Nenhum lançamento" : ""))],
      foot: foot ? [foot] : undefined,
      styles: { font: "helvetica", fontSize: 7.5, textColor: [23, 22, 15], cellPadding: 4 },
      headStyles: { fillColor: [255, 241, 184], textColor: [23, 22, 15], fontStyle: "bold" },
      footStyles: { fillColor: [247, 245, 236], textColor: [23, 22, 15], fontStyle: "bold" },
      margin: { left: 40, right: 40 },
    });
    return doc.lastAutoTable.finalY + 18;
  }

  function safeFileBit(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  async function generatePDF(type) {
    setPdfError("");
    try {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        setPdfError("Não foi possível carregar o gerador de PDF. Confira sua internet e tente de novo.");
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "a4" });

      if (type === "vendedor" && activeSeller) {
        let y = pdfLetterhead(doc);
        y = pdfTitle(doc, `Produção de ${activeSeller.nome} — ${MESES[monthIdx]} / ${year}`, y);
        const recs = (yearData[monthIdx] && yearData[monthIdx][activeSellerId]) || [];
        const rows = recs.map(r => [fmtDate(r.data) || "—", r.cliente || "", r.cpf || "—", r.produto || "—", formatBRL(r.valorVenda), formatBRL(parseNum(r.comissaoParceiro) + parseNum(r.comissaoExtra))]);
        const totalVenda = recs.reduce((a, r) => a + parseNum(r.valorVenda), 0);
        const totalCom = recs.reduce((a, r) => a + parseNum(r.comissaoParceiro) + parseNum(r.comissaoExtra), 0);
        pdfTable(doc, y, ["Data", "Cliente", "CPF", "Produto", "Valor liberado", "Comissão paga"], rows, ["", "", "", "Total", formatBRL(totalVenda), formatBRL(totalCom)]);
        doc.save(`producao-${safeFileBit(activeSeller.nome)}-${safeFileBit(MESES[monthIdx])}-${year}.pdf`);
      }

      else if (type === "mes") {
        let y = pdfLetterhead(doc);
        y = pdfTitle(doc, `Relatório de Produção — ${MESES[monthIdx]} / ${year}`, y);
        sellers.forEach(s => {
          const recs = (yearData[monthIdx] && yearData[monthIdx][s.id]) || [];
          if (recs.length === 0) return;
          if (y > 700) { doc.addPage(); y = pdfLetterhead(doc); }
          y = pdfSectionLabel(doc, `${s.nome} — ${recs.length} lançamento(s)`, y);
          const rows = recs.map(r => [fmtDate(r.data) || "—", r.cliente || "", r.cpf || "—", r.produto || "—", formatBRL(r.valorVenda), formatBRL(parseNum(r.comissaoParceiro) + parseNum(r.comissaoExtra))]);
          const subVenda = recs.reduce((a, r) => a + parseNum(r.valorVenda), 0);
          const subCom = recs.reduce((a, r) => a + parseNum(r.comissaoParceiro) + parseNum(r.comissaoExtra), 0);
          y = pdfTable(doc, y, ["Data", "Cliente", "CPF", "Produto", "Valor liberado", "Comissão paga"], rows, ["", "", "", "Subtotal", formatBRL(subVenda), formatBRL(subCom)]);
        });
        const prod = monthProductSummary();
        if (prod.length) {
          if (y > 680) { doc.addPage(); y = pdfLetterhead(doc); }
          y = pdfSectionLabel(doc, "Valores liberados por produto", y);
          y = pdfTable(doc, y, ["Produto", "Lançamentos", "Valor liberado"], prod.map(p => [p.produto, String(p.count), formatBRL(p.valorVenda)]));
        }
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9.5);
        doc.setTextColor(23, 22, 15);
        doc.text(`TOTAL GERAL DA COMPETÊNCIA — Valor liberado ${formatBRL(monthGrandTotal.valorVenda)} · Comissão paga ${formatBRL(monthGrandTotal.comissaoParceiro + monthGrandTotal.comissaoExtra)}`, 40, Math.min(y, 780));
        doc.save(`fechamento-mensal-${safeFileBit(MESES[monthIdx])}-${year}.pdf`);
      }

      else if (type === "ano") {
        const ann = annualSummary();
        let y = pdfLetterhead(doc);
        y = pdfTitle(doc, `Relatório Anual de Produção — 01/01 a 31/12 de ${year}`, y);
        doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(23, 22, 15);
        doc.text(`Total emprestado ${formatBRL(ann.totals.valorVenda)} · Recebido ${formatBRL(ann.totals.recebidoValor)} · Pendente ${formatBRL(ann.totals.pendenteValor)} · Comissão paga ${formatBRL(ann.totals.comissao)}`, 40, y);
        y += 18;
        y = pdfSectionLabel(doc, "Por vendedor", y);
        y = pdfTable(doc, y, ["Vendedor", "Lanç.", "Emprestado", "Recebido", "Pendente", "Comissão"],
          ann.perSeller.map(p => [p.seller.nome, String(p.count), formatBRL(p.valorVenda), formatBRL(p.recebidoValor), formatBRL(p.pendenteValor), formatBRL(p.comissao)]),
          ["TOTAL", String(ann.totals.count), formatBRL(ann.totals.valorVenda), formatBRL(ann.totals.recebidoValor), formatBRL(ann.totals.pendenteValor), formatBRL(ann.totals.comissao)]);
        const prod = annualProductSummary();
        if (prod.length) {
          if (y > 650) { doc.addPage(); y = pdfLetterhead(doc); }
          y = pdfSectionLabel(doc, "Valores liberados por produto no ano", y);
          y = pdfTable(doc, y, ["Produto", "Lançamentos", "Valor liberado"], prod.map(p => [p.produto, String(p.count), formatBRL(p.valorVenda)]));
        }
        if (y > 600) { doc.addPage(); y = pdfLetterhead(doc); }
        y = pdfSectionLabel(doc, "Por mês", y);
        y = pdfTable(doc, y, ["Mês", "Lançamentos", "Valor liberado"], ann.perMonth.map(m => [m.nome, String(m.count), formatBRL(m.valorVenda)]));
        doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(23, 22, 15);
        doc.text(`FECHAMENTO ${year} — TODOS OS VENDEDORES: Total liberado ${formatBRL(ann.totals.valorVenda)} · Comissão paga ${formatBRL(ann.totals.comissao)}`, 40, Math.min(y, 780));
        doc.save(`fechamento-anual-${year}.pdf`);
      }
    } catch (e) {
      setPdfError("Não foi possível gerar o PDF. Tente novamente.");
    }
  }

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const res = await safeGet("crediti-sellers", true);
      if (cancelled) return;
      if (res && res.value) {
        try {
          const parsed = JSON.parse(res.value);
          if (Array.isArray(parsed) && parsed.length > 0) { setSellers(parsed); return; }
        } catch (e) {}
      }
      await safeSet("crediti-sellers", JSON.stringify(DEFAULT_SELLERS), true);
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const res = await safeList("crediti-records-", true);
      if (cancelled || !res || !res.keys) return;
      const yrs = res.keys.map(k => parseInt(k.replace("crediti-records-", ""), 10)).filter(n => !isNaN(n));
      const all = Array.from(new Set([...computeBaseYears(), ...yrs])).sort((a, b) => a - b);
      setAvailableYears(all);
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    (async () => {
      const res = await safeGet(`crediti-records-${year}`, true);
      if (cancelled) return;
      if (res && res.value) {
        try { setYearData(JSON.parse(res.value)); } catch (e) { setYearData({}); }
      } else { setYearData({}); }
      setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [year]);

  const persistYearData = useCallback(async (updated) => {
    setSaving(true);
    const result = await safeSet(`crediti-records-${year}`, JSON.stringify(updated), true);
    if (!result) setError("Não deu para salvar agora. Confira sua internet e tente de novo.");
    setSaving(false);
  }, [year]);

  const persistSellers = useCallback(async (updated) => {
    setSaving(true);
    const result = await safeSet("crediti-sellers", JSON.stringify(updated), true);
    if (!result) setError("Não deu para salvar o vendedor. Tente de novo.");
    setSaving(false);
  }, []);

  function sellerTotalsForMonth(sellerId, mIdx) {
    const recs = (yearData[mIdx] && yearData[mIdx][sellerId]) || [];
    return recs.reduce((acc, r) => {
      acc.valorVenda += parseNum(r.valorVenda);
      acc.comissaoParceiro += parseNum(r.comissaoParceiro);
      acc.comissaoExtra += parseNum(r.comissaoExtra);
      acc.count += 1;
      return acc;
    }, { valorVenda: 0, comissaoParceiro: 0, comissaoExtra: 0, count: 0 });
  }

  const monthRecords = useMemo(() => (activeSellerId && yearData[monthIdx] && yearData[monthIdx][activeSellerId]) || [], [yearData, monthIdx, activeSellerId]);
  const monthSummary = useMemo(() => sellers.map(s => ({ seller: s, totals: sellerTotalsForMonth(s.id, monthIdx) })), [sellers, yearData, monthIdx]);
  const monthGrandTotal = useMemo(() => monthSummary.reduce((acc, s) => {
    acc.valorVenda += s.totals.valorVenda; acc.comissaoParceiro += s.totals.comissaoParceiro;
    acc.comissaoExtra += s.totals.comissaoExtra; acc.count += s.totals.count;
    return acc;
  }, { valorVenda: 0, comissaoParceiro: 0, comissaoExtra: 0, count: 0 }), [monthSummary]);

  function monthProductSummary() {
    const map = {};
    sellers.forEach(s => {
      const recs = (yearData[monthIdx] && yearData[monthIdx][s.id]) || [];
      recs.forEach(r => {
        const key = (r.produto || "").trim() || "Não informado";
        if (!map[key]) map[key] = { produto: key, valorVenda: 0, count: 0 };
        map[key].valorVenda += parseNum(r.valorVenda);
        map[key].count += 1;
      });
    });
    return Object.values(map).sort((a, b) => b.valorVenda - a.valorVenda);
  }

  function annualProductSummary() {
    const map = {};
    for (let mIdx = 0; mIdx < 12; mIdx++) {
      const monthData = yearData[mIdx] || {};
      sellers.forEach(s => {
        const recs = monthData[s.id] || [];
        recs.forEach(r => {
          const key = (r.produto || "").trim() || "Não informado";
          if (!map[key]) map[key] = { produto: key, valorVenda: 0, count: 0 };
          map[key].valorVenda += parseNum(r.valorVenda);
          map[key].count += 1;
        });
      });
    }
    return Object.values(map).sort((a, b) => b.valorVenda - a.valorVenda);
  }

  function annualSummary() {
    const perSeller = sellers.map(s => ({ seller: s, valorVenda: 0, comissao: 0, recebidoValor: 0, pendenteValor: 0, count: 0 }));
    const perSellerMap = {};
    perSeller.forEach(p => { perSellerMap[p.seller.id] = p; });
    const perMonth = MESES.map((m, i) => ({ idx: i, nome: m, valorVenda: 0, count: 0 }));
    const totals = { valorVenda: 0, comissao: 0, recebidoValor: 0, pendenteValor: 0, count: 0 };
    for (let mIdx = 0; mIdx < 12; mIdx++) {
      const monthData = yearData[mIdx] || {};
      sellers.forEach(s => {
        const recs = monthData[s.id] || [];
        recs.forEach(r => {
          const venda = parseNum(r.valorVenda);
          const com = parseNum(r.comissaoParceiro) + parseNum(r.comissaoExtra);
          const p = perSellerMap[s.id];
          p.valorVenda += venda; p.comissao += com; p.count += 1;
          if (r.dataRecebimento) p.recebidoValor += venda; else p.pendenteValor += venda;
          perMonth[mIdx].valorVenda += venda; perMonth[mIdx].count += 1;
          totals.valorVenda += venda; totals.comissao += com; totals.count += 1;
          if (r.dataRecebimento) totals.recebidoValor += venda; else totals.pendenteValor += venda;
        });
      });
    }
    return { perSeller, perMonth, totals };
  }

  const activeSeller = sellers.find(s => s.id === activeSellerId);
  const activeSellerTotals = activeSellerId ? sellerTotalsForMonth(activeSellerId, monthIdx) : null;

  function openNewRecord() { setEditingRecord(null); setForm({ ...CAMPOS_VAZIOS }); setModalOpen(true); }
  function openEditRecord(rec) { setEditingRecord(rec.id); setForm({ ...rec }); setModalOpen(true); }

  async function saveRecord() {
    if (!form.cliente.trim()) { setError("Informe o nome do cliente."); return; }
    const updated = JSON.parse(JSON.stringify(yearData));
    if (!updated[monthIdx]) updated[monthIdx] = {};
    if (!updated[monthIdx][activeSellerId]) updated[monthIdx][activeSellerId] = [];
    if (editingRecord) {
      updated[monthIdx][activeSellerId] = updated[monthIdx][activeSellerId].map(r => r.id === editingRecord ? { ...form, id: editingRecord } : r);
    } else {
      updated[monthIdx][activeSellerId].push({ ...form, id: uid() });
    }
    setYearData(updated); setModalOpen(false); setError("");
    await persistYearData(updated);
  }

  async function deleteRecord(id) {
    const updated = JSON.parse(JSON.stringify(yearData));
    if (updated[monthIdx] && updated[monthIdx][activeSellerId]) {
      updated[monthIdx][activeSellerId] = updated[monthIdx][activeSellerId].filter(r => r.id !== id);
    }
    setYearData(updated); setConfirmDelete(null);
    await persistYearData(updated);
  }

  async function addSeller() {
    const name = newSellerName.trim();
    if (!name) return;
    const id = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || uid();
    if (sellers.some(s => s.id === id)) { setError("Já existe um vendedor com esse nome."); return; }
    const updated = [...sellers, { id, nome: name }];
    setSellers(updated); setNewSellerName(""); setAddingSeller(false);
    await persistSellers(updated);
  }

  async function removeSeller(id) {
    if (sellers.length <= 1) return;
    const updated = sellers.filter(s => s.id !== id);
    setSellers(updated);
    if (activeSellerId === id) { setActiveSellerId(null); setScreen("home"); }
    await persistSellers(updated);
  }

  function addYear() {
    const next = Math.max(...availableYears) + 1;
    setAvailableYears([...availableYears, next]);
    setYear(next);
  }

  function goToSeller(id) { setActiveSellerId(id); setScreen("seller"); }

  return (
    <div style={{ fontFamily: "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" }} className="app-shell min-h-screen bg-[#FFF7DC] text-[#17160F] pb-20 sm:pb-8">
      <style>{`
        .num{font-variant-numeric:tabular-nums}
        ::-webkit-scrollbar{height:6px;width:6px}
        ::-webkit-scrollbar-thumb{background:#E9D98A;border-radius:4px}
        .input{width:100%;border:1.5px solid #E7DDAE;border-radius:10px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;transition:.15s;background:#fff;color:#17160F}
        .input:focus{border-color:#D9A400;box-shadow:0 0 0 3px rgba(217,164,0,.18)}
        .input::placeholder{color:#B8AF87}
      `}</style>

      {/* ===== Top bar ===== */}
      <header className="sticky top-0 z-30 bg-[#FFFBEE]/95 backdrop-blur border-b border-[#EFE2A8]">
        <div className="max-w-[860px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-2.5 min-w-0">
            <img src={`data:image/png;base64,${LOGO_B64}`} alt="Crediti" className="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex-shrink-0" />
            <div className="min-w-0">
              <div className="text-[14.5px] sm:text-[16px] font-extrabold text-[#17160F] tracking-tight leading-tight truncate">Crediti</div>
              <div className="text-[9.5px] sm:text-[10.5px] text-[#8A7A1F] font-bold tracking-[0.12em] -mt-0.5">SOLUÇÕES FINANCEIRAS</div>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            {saving && <Loader2 size={14} className="animate-spin text-[#8A7A1F]" />}
            <div className="relative">
              <select value={year} onChange={e => setYear(parseInt(e.target.value, 10))}
                className="appearance-none bg-white text-[#17160F] text-[13px] font-bold pl-3 pr-7 py-1.5 rounded-lg border border-[#E7DDAE] focus:outline-none focus:ring-2 focus:ring-[#D9A400] cursor-pointer">
                {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
              </select>
              <ChevronDown size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-[#8A7A1F]" />
            </div>
            <button onClick={addYear} title="Adicionar próximo ano" className="hidden sm:block text-[12px] font-bold bg-white hover:bg-[#FFF1B8] border border-[#E7DDAE] text-[#8A7A1F] px-2.5 py-1.5 rounded-lg transition">+ ano</button>
          </div>
        </div>
      </header>

      {error && (
        <div className="bg-[#FBE4E1] text-[#A3271E] text-[13px] px-4 sm:px-6 py-2.5 flex items-center gap-2 border-b border-[#f0c4bf]">
          <AlertCircle size={15} className="flex-shrink-0" />
          <span className="flex-1">{error}</span>
          <button onClick={() => setError("")} className="text-[#A3271E]/60 hover:text-[#A3271E]"><X size={14} /></button>
        </div>
      )}
      {pdfError && (
        <div className="bg-[#FBE4E1] text-[#A3271E] text-[13px] px-4 sm:px-6 py-2.5 flex items-center gap-2 border-b border-[#f0c4bf]">
          <AlertCircle size={15} className="flex-shrink-0" />
          <span className="flex-1">{pdfError}</span>
          <button onClick={() => setPdfError("")} className="text-[#A3271E]/60 hover:text-[#A3271E]"><X size={14} /></button>
        </div>
      )}

      <div className="max-w-[860px] mx-auto px-4 sm:px-6 pt-5">

        {/* ============ HOME ============ */}
        {screen === "home" && (
          <>
            <div className="mb-1 text-[20px] sm:text-[23px] font-extrabold text-[#17160F] tracking-tight">Produção de {MESES[monthIdx]}</div>
            <div className="mb-5 text-[13px] text-[#7A7154]">Escolha o vendedor para lançar ou conferir os dados de {year}.</div>

                  <button key={m} onClick={() => setMonthIdx(i)}

                    <span className="sm:hidden">{MESES_ABREV[i]}</span><span className="hidden sm:inline">{m}</span>

              <button onClick={() => setMonthIdx(i => (i + 1) % 12)} className="w-8 h-8 rounded-full bg-white border border-[#E7DDAE] flex items-center justify-center text-[#8A7A1F] hover:bg-[#FFF1B8] transition flex-shrink-0"><ChevronRight size={15} /></button>

                  <ClipboardList size={14} /> Fechar ano (PDF)

              <button
                onClick={() => { setManageSellers(v => !v); setConfirmDeleteSeller(null); }}
                className={`text-[11.5px] font-bold px-2.5 py-1 rounded-full transition ${manageSellers ? "bg-[#17160F] text-[#FFD447]" : "text-[#8A7A1F] hover:bg-[#FFF1B8]"}`}
              >
                {manageSellers ? "Concluir" : "Gerenciar"}
              </button>
            </div>

            <div className="bg-white rounded-2xl border border-[#EFE2A8] overflow-hidden divide-y divide-[#F5EDCB] shadow-[0_1px_2px_rgba(120,100,0,0.05)]">
              {sellers.map(s => {
                const t = sellerTotalsForMonth(s.id, monthIdx);

                if (manageSellers) {
                  return (
                    <div key={s.id} className="flex items-center gap-3 px-4 py-3.5">
                      <span className="w-10 h-10 rounded-full bg-[#FFEDA0] text-[#8A7A1F] text-[13px] font-extrabold flex items-center justify-center flex-shrink-0">{initials(s.nome)}</span>
                      <div className="min-w-0 flex-1">
                        <div className="font-bold text-[14px] text-[#17160F] truncate">{s.nome}</div>
                        <div className="text-[11.5px] text-[#8A8672]">{t.count} lançamento(s) em {MESES[monthIdx].toLowerCase()}</div>
                      </div>
                      {sellers.length > 1 ? (
                        confirmDeleteSeller === s.id ? (
                          <div className="flex items-center gap-2 flex-shrink-0">
                            <span className="text-[11.5px] text-[#7A7154]">remover?</span>
                            <button onClick={() => { removeSeller(s.id); setConfirmDeleteSeller(null); }} className="text-[12px] font-bold text-white bg-[#A3271E] px-2.5 py-1.5 rounded-lg">Sim</button>
                            <button onClick={() => setConfirmDeleteSeller(null)} className="text-[12px] font-bold text-[#7A7154] bg-[#F5EDCB] px-2.5 py-1.5 rounded-lg">Não</button>
                          </div>
                        ) : (
                          <button onClick={() => setConfirmDeleteSeller(s.id)} title="Remover vendedor"
                            className="flex items-center gap-1.5 text-[12px] font-bold text-[#A3271E] border border-[#F0C4BF] bg-[#FBE4E1] px-2.5 py-1.5 rounded-lg flex-shrink-0 hover:bg-[#f5d3ce] transition">
                            <Trash2 size={13} /> Remover
                          </button>
                        )
                      ) : (
                        <span className="text-[11px] text-[#C9BE85] flex-shrink-0">único vendedor</span>
                      )}
                    </div>
                  );
                }

                return (
                  <button key={s.id} onClick={() => goToSeller(s.id)} className="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-[#FFFBEE] transition text-left">
                    <span className="w-10 h-10 rounded-full bg-[#FFEDA0] text-[#8A7A1F] text-[13px] font-extrabold flex items-center justify-center flex-shrink-0">{initials(s.nome)}</span>
                    <div className="min-w-0 flex-1">
                      <div className="font-bold text-[14px] text-[#17160F] truncate">{s.nome}</div>
                      <div className="text-[11.5px] text-[#8A8672]">{t.count} lançamento(s)</div>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <div className="num font-extrabold text-[14px] text-[#17160F]">{formatBRL(t.valorVenda)}</div>
                      <div className="text-[11px] text-[#8A7A1F]">produção</div>
                    </div>
                    <ChevronRight size={16} className="text-[#C9BE85] flex-shrink-0" />
                  </button>
                );
              })}

              {!manageSellers && (
                <div className="px-4 py-3">
                  {addingSeller ? (
                    <div className="flex items-center gap-1.5">
                      <input autoFocus value={newSellerName} onChange={e => setNewSellerName(e.target.value)}
                        onKeyDown={e => { if (e.key === "Enter") addSeller(); if (e.key === "Escape") setAddingSeller(false); }}
                        placeholder="Nome do vendedor" className="input flex-1" />
                      <button onClick={addSeller} className="w-9 h-9 rounded-lg bg-[#17160F] text-[#FFD447] flex items-center justify-center flex-shrink-0"><Save size={14} /></button>
                      <button onClick={() => { setAddingSeller(false); setNewSellerName(""); }} className="w-9 h-9 rounded-lg bg-[#F5EDCB] flex items-center justify-center flex-shrink-0"><X size={14} /></button>
                    </div>
                  ) : (
                    <button onClick={() => setAddingSeller(true)} className="w-full flex items-center gap-2 text-[13px] font-bold text-[#8A7A1F] hover:text-[#17160F] transition py-1">
                      <span className="w-10 h-10 rounded-full border-2 border-dashed border-[#E7DDAE] flex items-center justify-center flex-shrink-0"><Plus size={15} /></span>
                      Adicionar vendedor
                    </button>
                  )}
                </div>
              )}
            </div>
          </>
        )}

        {/* ============ SELLER (extrato) ============ */}
        {screen === "seller" && activeSeller && (
          <>
            <button onClick={() => setScreen("home")} className="flex items-center gap-1 text-[13px] font-bold text-[#8A7A1F] hover:text-[#17160F] mb-3 transition"><ChevronLeft size={16} /> Vendedores</button>

            <div className="flex items-center gap-3 mb-4">
              <span className="w-12 h-12 rounded-full bg-[#FFEDA0] text-[#8A7A1F] text-[15px] font-extrabold flex items-center justify-center flex-shrink-0">{initials(activeSeller.nome)}</span>
              <div className="min-w-0">
                <div className="text-[19px] sm:text-[21px] font-extrabold text-[#17160F] tracking-tight truncate">{activeSeller.nome}</div>
                <div className="text-[12.5px] text-[#7A7154]">Produção de {MESES[monthIdx]} · {year}</div>
              </div>
            </div>

            {/* Month chips */}
            <div className="flex gap-1.5 overflow-x-auto mb-4 pb-0.5">
              {MESES.map((m, i) => (
                <button key={m} onClick={() => setMonthIdx(i)}
                  className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[12.5px] font-bold transition ${monthIdx === i ? "bg-[#17160F] text-[#FFD447]" : "bg-white text-[#7A7154] border border-[#E7DDAE] hover:bg-[#FFF1B8]"}`}>
                  {MESES_ABREV[i]}
                </button>
              ))}
            </div>

            {/* KPI strip */}
            <div className="grid grid-cols-3 gap-2.5 mb-5">
              <StatCard label="Produção" value={formatBRL(activeSellerTotals.valorVenda)} strong />
              <StatCard label="Com. por fora" value={formatBRL(activeSellerTotals.comissaoExtra)} />
              <StatCard label="Com. parceiro" value={formatBRL(activeSellerTotals.comissaoParceiro)} />
            </div>

            <div className="flex items-center justify-between mb-2 px-0.5 gap-2">
              <div className="text-[11px] font-extrabold text-[#8A7A1F] uppercase tracking-wider">Extrato de vendas</div>
              <div className="flex items-center gap-2">
                <button onClick={() => generatePDF("vendedor")} className="flex items-center gap-1.5 bg-white border border-[#E7DDAE] text-[#17160F] text-[12.5px] font-bold px-3 py-2 rounded-lg hover:bg-[#FFF1B8] transition">
                  <Receipt size={14} /> Gerar PDF
                </button>
                <button onClick={openNewRecord} className="flex items-center gap-1.5 bg-[#17160F] text-[#FFD447] text-[12.5px] font-bold px-3 py-2 rounded-lg hover:bg-[#2a2818] transition">
                  <Plus size={14} /> Novo lançamento
                </button>
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-[#EFE2A8] overflow-hidden shadow-[0_1px_2px_rgba(120,100,0,0.05)]">
              {loading ? (
                <div className="py-16 flex items-center justify-center text-[#B8AF87] gap-2 text-sm"><Loader2 size={16} className="animate-spin" /> Carregando...</div>
              ) : monthRecords.length === 0 ? (
                <div className="py-14 text-center text-[#B8AF87] text-sm px-6">Nenhum lançamento em {MESES[monthIdx].toLowerCase()}.<br />Toque em "Novo lançamento" para registrar a primeira venda.</div>
              ) : (
                <div className="divide-y divide-[#F5EDCB]">
                  {monthRecords.map(r => (
                    <div key={r.id} className="px-4 py-3.5 hover:bg-[#FFFBEE] transition group">
                      <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0 flex-1">
                          <div className="font-bold text-[14px] text-[#17160F] truncate">{r.cliente}</div>
                          <div className="text-[11.5px] text-[#8A8672] truncate num">{fmtDate(r.data) || "sem data"} · {r.produto || "produto não informado"}</div>
                          {(r.cpf || r.telefone) && <div className="text-[11px] text-[#B8AF87] num mt-0.5">{r.cpf || "CPF —"} {r.telefone ? `· ${r.telefone}` : ""}</div>}
                        </div>
                        <div className="text-right flex-shrink-0">
                          <div className="num font-extrabold text-[15px] text-[#17160F]">{formatBRL(r.valorVenda)}</div>
                          {r.dataRecebimento
                            ? <span className="inline-flex items-center gap-1 text-[#1E8E5A] font-bold text-[11px] mt-0.5"><CheckCircle2 size={11} />recebido {fmtDate(r.dataRecebimento)}</span>
                            : <span className="inline-flex items-center gap-1 text-[#B7791F] text-[11px] mt-0.5"><Clock3 size={11} />pendente</span>}
                        </div>
                      </div>
                      <div className="flex items-center justify-between mt-2 flex-wrap gap-y-1">
                        <div className="text-[11px] text-[#8A8672]">
                          com. por fora <b className="num text-[#17160F]">{formatBRL(r.comissaoExtra)}</b> · com. parceiro <b className="num text-[#17160F]">{formatBRL(r.comissaoParceiro)}</b>
                          {" · "}
                          {r.dataComissaoRecebida
                            ? <span className="inline-flex items-center gap-1 text-[#1E8E5A] font-bold"><CheckCircle2 size={11} />comissão recebida {fmtDate(r.dataComissaoRecebida)}</span>
                            : <span className="inline-flex items-center gap-1 text-[#B7791F]"><Clock3 size={11} />comissão pendente</span>}
                        </div>
                        <div className="flex items-center gap-1 transition">
                          <button onClick={() => openEditRecord(r)} className="w-7 h-7 rounded-md hover:bg-[#F5EDCB] flex items-center justify-center text-[#7A7154]"><Pencil size={15} /></button>
                          {confirmDelete === r.id ? (
                            <>
                              <button onClick={() => deleteRecord(r.id)} className="text-[11px] font-bold text-[#A3271E] px-1">confirmar</button>
                              <button onClick={() => setConfirmDelete(null)} className="text-[11px] text-[#8A8672] px-1">cancelar</button>
                            </>
                          ) : (
                            <button onClick={() => setConfirmDelete(r.id)} className="w-7 h-7 rounded-md hover:bg-[#FBE4E1] flex items-center justify-center text-[#7A7154] hover:text-[#A3271E]"><Trash2 size={13} /></button>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                  <div className="px-4 py-3 bg-[#FFFBEE] flex items-center justify-between">
                    <span className="text-[11.5px] font-extrabold text-[#17160F] uppercase tracking-wide">Total do mês</span>
                    <span className="num font-extrabold text-[#17160F]">{formatBRL(activeSellerTotals.valorVenda)}</span>
                  </div>
                </div>
              )}
            </div>
          </>
        )}

        {/* ============ RESUMO ============ */}
        {screen === "resumo" && (
          <>
            <button onClick={() => setScreen("home")} className="flex items-center gap-1 text-[13px] font-bold text-[#8A7A1F] hover:text-[#17160F] mb-3 transition"><ChevronLeft size={16} /> Início</button>
            <div className="mb-3">
              <div className="text-[19px] sm:text-[21px] font-extrabold text-[#17160F] tracking-tight">Resumo do escritório</div>
              <div className="text-[12.5px] text-[#7A7154] mt-0.5">{MESES[monthIdx]} · {year}</div>
            </div>
            <div className="flex items-center gap-2 mb-3">
              <button onClick={() => generatePDF("mes")}
                className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-[#17160F] text-[#FFD447] text-[12px] font-bold px-3 py-2.5 rounded-lg hover:bg-[#2a2818] transition">
                <Receipt size={14} /> Fechar mês (PDF)
              </button>
              <button onClick={() => generatePDF("ano")}
                className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-white border border-[#E7DDAE] text-[#17160F] text-[12px] font-bold px-3 py-2.5 rounded-lg hover:bg-[#FFF1B8] transition">
                <ClipboardList size={14} /> Fechar ano (PDF)
              </button>
            </div>
            <div className="h-1"></div>

            <div className="flex gap-1.5 overflow-x-auto mb-5 pb-0.5">
              {MESES.map((m, i) => (
                <button key={m} onClick={() => setMonthIdx(i)}
                  className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[12.5px] font-bold transition ${monthIdx === i ? "bg-[#17160F] text-[#FFD447]" : "bg-white text-[#7A7154] border border-[#E7DDAE] hover:bg-[#FFF1B8]"}`}>
                  {MESES_ABREV[i]}
                </button>
              ))}
            </div>

            <div className="bg-white rounded-2xl border border-[#EFE2A8] overflow-hidden divide-y divide-[#F5EDCB] shadow-[0_1px_2px_rgba(120,100,0,0.05)] mb-4">
              {monthSummary.map(({ seller, totals }) => (
                <button key={seller.id} onClick={() => goToSeller(seller.id)} className="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-[#FFFBEE] transition text-left">
                  <span className="w-10 h-10 rounded-full bg-[#FFEDA0] text-[#8A7A1F] text-[13px] font-extrabold flex items-center justify-center flex-shrink-0">{initials(seller.nome)}</span>
                  <div className="min-w-0 flex-1">
                    <div className="font-bold text-[14px] text-[#17160F] truncate">{seller.nome}</div>
                    <div className="text-[11.5px] text-[#8A8672]">{totals.count} lançamento(s) · com. {formatBRL(totals.comissaoParceiro + totals.comissaoExtra)}</div>
                  </div>
                  <div className="num font-extrabold text-[14px] text-[#17160F] flex-shrink-0">{formatBRL(totals.valorVenda)}</div>
                  <ChevronRight size={16} className="text-[#C9BE85] flex-shrink-0" />
                </button>
              ))}
            </div>

            <div className="bg-[#17160F] rounded-2xl p-4 sm:p-5">
              <div className="text-[10.5px] font-bold text-[#FFD447] uppercase tracking-wider mb-2">Total geral do mês</div>
              <div className="grid grid-cols-3 gap-3">
                <div>
                  <div className="text-[10px] text-white/40 uppercase tracking-wide mb-0.5">Produção</div>
                  <div className="num font-extrabold text-white text-[15px] sm:text-[17px]">{formatBRL(monthGrandTotal.valorVenda)}</div>
                </div>
                <div>
                  <div className="text-[10px] text-white/40 uppercase tracking-wide mb-0.5">Com. por fora</div>
                  <div className="num font-extrabold text-white text-[15px] sm:text-[17px]">{formatBRL(monthGrandTotal.comissaoExtra)}</div>
                </div>
                <div>
                  <div className="text-[10px] text-white/40 uppercase tracking-wide mb-0.5">Com. parceiro</div>
                  <div className="num font-extrabold text-white text-[15px] sm:text-[17px]">{formatBRL(monthGrandTotal.comissaoParceiro)}</div>
                </div>
              </div>
            </div>
          </>
        )}
      </div>

      {/* ===== Bottom nav (mobile, bank-app style) ===== */}
      <nav className="sm:hidden fixed bottom-0 inset-x-0 z-30 bg-[#FFFBEE]/95 backdrop-blur border-t border-[#EFE2A8] flex items-stretch">
        <NavBtn icon={<Home size={18} />} label="Início" active={screen === "home"} onClick={() => setScreen("home")} />
        <NavBtn icon={<LayoutList size={18} />} label="Extrato" active={screen === "seller"} onClick={() => { if (activeSellerId) setScreen("seller"); else if (sellers[0]) goToSeller(sellers[0].id); }} />
        <NavBtn icon={<PiggyBank size={18} />} label="Resumo" active={screen === "resumo"} onClick={() => setScreen("resumo")} />
      </nav>

      {/* ===== Modal ===== */}
      {modalOpen && (
        <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50" onClick={() => setModalOpen(false)}>
          <div className="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[92vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="px-5 py-4 border-b border-[#F0EAC8] flex items-center justify-between sticky top-0 bg-white z-10">
              <div className="font-extrabold text-[15px] text-[#17160F]">{editingRecord ? "Editar lançamento" : "Novo lançamento"} — {activeSeller?.nome}</div>
              <button onClick={() => setModalOpen(false)} className="w-8 h-8 rounded-full hover:bg-[#F5EDCB] flex items-center justify-center"><X size={16} /></button>
            </div>
            <div className="p-5 space-y-3.5">
              <div className="grid grid-cols-2 gap-4 sm:gap-5">
                <Field label="Data da venda">
                  <input
                    type="text" inputMode="numeric" maxLength={10}
                    value={form.data}
                    onChange={e => setForm({ ...form, data: maskDateInput(e.target.value) })}
                    className="input" placeholder="dd/mm/aaaa"
                  />
                </Field>
                <Field label="Cliente recebeu em">
                  <input
                    type="text" inputMode="numeric" maxLength={10}
                    value={form.dataRecebimento}
                    onChange={e => setForm({ ...form, dataRecebimento: maskDateInput(e.target.value) })}
                    className="input" placeholder="dd/mm/aaaa"
                  />
                </Field>
              </div>
              <Field label="Nome do cliente"><input value={form.cliente} onChange={e => setForm({ ...form, cliente: e.target.value })} className="input" placeholder="Ex: José da Silva" /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="CPF"><input value={form.cpf} onChange={e => setForm({ ...form, cpf: maskCPF(e.target.value) })} className="input" placeholder="000.000.000-00" inputMode="numeric" /></Field>
                <Field label="Telefone"><input value={form.telefone} onChange={e => setForm({ ...form, telefone: maskPhone(e.target.value) })} className="input" placeholder="(85) 99000-0000" inputMode="numeric" /></Field>
              </div>
              <Field label="Telefone é de quem? (se não for do cliente)"><input value={form.telefoneTitular} onChange={e => setForm({ ...form, telefoneTitular: e.target.value })} className="input" placeholder="Ex: filha — Maria" /></Field>
              <Field label="Produto"><input value={form.produto} onChange={e => setForm({ ...form, produto: e.target.value })} className="input" placeholder="Ex: Consignado INSS" /></Field>
              <div className="grid grid-cols-3 gap-3">
                <Field label="Valor da venda"><input value={form.valorVenda} onChange={e => setForm({ ...form, valorVenda: maskCurrency(e.target.value) })} className="input" placeholder="R$ 0,00" inputMode="numeric" /></Field>
                <Field label="Com. por fora"><input value={form.comissaoExtra} onChange={e => setForm({ ...form, comissaoExtra: maskCurrency(e.target.value) })} className="input" placeholder="R$ 0,00" inputMode="numeric" /></Field>
                <Field label="Com. parceiro"><input value={form.comissaoParceiro} onChange={e => setForm({ ...form, comissaoParceiro: maskCurrency(e.target.value) })} className="input" placeholder="R$ 0,00" inputMode="numeric" /></Field>
              </div>
              <Field label="Vendedor recebeu a comissão em">
                <input
                  type="text" inputMode="numeric" maxLength={10}
                  value={form.dataComissaoRecebida}
                  onChange={e => setForm({ ...form, dataComissaoRecebida: maskDateInput(e.target.value) })}
                  className="input" placeholder="dd/mm/aaaa — deixe em branco se ainda não recebeu"
                />
              </Field>
              <Field label="Observações"><textarea value={form.observacoes} onChange={e => setForm({ ...form, observacoes: e.target.value })} className="input min-h-[70px] resize-none" placeholder="Anotações adicionais..." /></Field>
            </div>
            <div className="px-5 py-4 border-t border-[#F0EAC8] flex items-center gap-2 justify-end sticky bottom-0 bg-white">
              <button onClick={() => setModalOpen(false)} className="px-4 py-2 rounded-lg text-[13px] font-bold text-[#7A7154] hover:bg-[#F5EDCB] transition">Cancelar</button>
              <button onClick={saveRecord} className="px-4 py-2 rounded-lg text-[13px] font-bold bg-[#FFD447] text-[#17160F] hover:bg-[#f0c62f] transition flex items-center gap-1.5"><Save size={14} /> Salvar</button>
            </div>
          </div>
        </div>
      )}

      <footer className="hidden sm:block text-center text-[11px] text-[#B8AF87] pt-8 pb-4">Crediti Soluções Financeiras · dados salvos automaticamente na nuvem</footer>
    </div>
  );
}

function StatCard({ label, value, strong }) {
  return (
    <div className="bg-white rounded-xl border border-[#EFE2A8] px-3 py-2.5">
      <div className="text-[9.5px] font-bold text-[#8A7A1F] uppercase tracking-wide">{label}</div>
      <div className={`num text-[13px] sm:text-[14px] mt-0.5 truncate ${strong ? "font-extrabold text-[#17160F]" : "font-semibold text-[#4A4636]"}`}>{value}</div>
    </div>
  );
}

function NavBtn({ icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 ${active ? "text-[#17160F]" : "text-[#B8AF87]"}`}>
      <span className={`w-9 h-6 rounded-full flex items-center justify-center transition ${active ? "bg-[#FFD447]" : ""}`}>{icon}</span>
      <span className="text-[10px] font-bold">{label}</span>
    </button>
  );
}

function Field({ label, children }) {
  return (
    <label className="block">
      <span className="block text-[10.5px] font-bold text-[#8A7A1F] mb-1 uppercase tracking-wide">{label}</span>
      {children}
    </label>
  );
}

function SetupNeeded() {
  return React.createElement("div", {
    style: { fontFamily: "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif", minHeight: "100vh", background: "#FFF7DC", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }
  }, React.createElement("div", {
    style: { background: "#fff", borderRadius: 16, padding: 28, maxWidth: 480, border: "1px solid #EFE2A8", boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }
  },
    React.createElement("div", { style: { fontSize: 18, fontWeight: 800, color: "#17160F", marginBottom: 10 } }, "Falta configurar o Firebase"),
    React.createElement("div", { style: { fontSize: 13.5, color: "#4A4636", lineHeight: 1.6 } },
      "Abra o arquivo HTML num editor de texto, procure por FIREBASE_CONFIG no topo, e cole ali os dados do seu projeto Firebase (apiKey, projectId, etc). Depois salve e publique de novo no Netlify."
    )
  ));
}

const root = ReactDOM.createRoot(document.getElementById("root"));
if (window.__FIREBASE_NOT_CONFIGURED__) {
  root.render(React.createElement(SetupNeeded));
} else {
  root.render(React.createElement(CreditiProducao));
}
</script>
</body>
</html>
