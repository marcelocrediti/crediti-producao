const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCUn7aDxaVYmDpR2GGS9c0f8sPbgFOeXvk",
  authDomain: "crediti-producao.firebaseapp.com",
  projectId: "crediti-producao",
  storageBucket: "crediti-producao.firebasestorage.app",
  messagingSenderId: "486060664110",
  appId: "1:486060664110:web:d140bca30b1d3e733346bf"
};

const FIREBASE_NOT_CONFIGURED = FIREBASE_CONFIG.apiKey === "COLE_AQUI_SUA_API_KEY";
window.__FIREBASE_NOT_CONFIGURED__ = FIREBASE_NOT_CONFIGURED;

let db = null;
if (!FIREBASE_NOT_CONFIGURED) {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
}

// ---- Storage shim: implementa a mesma API (get/set/list) usando Firestore ----
function docId(key, shared) {
  return (shared ? "shared_" : "local_") + key;
}
window.storage = {
  get: function(key, shared) {
    if (!db) return Promise.reject(new Error("Firebase não configurado"));
    return db.collection("crediti_storage").doc(docId(key, shared)).get().then(function(snap) {
      if (!snap.exists) throw new Error("not found");
      return { key: key, value: snap.data().value, shared: !!shared };
    });
  },
  set: function(key, value, shared) {
    if (!db) return Promise.reject(new Error("Firebase não configurado"));
    return db.collection("crediti_storage").doc(docId(key, shared)).set({ value: value }).then(function() {
      return { key: key, value: value, shared: !!shared };
    });
  },
  delete: function(key, shared) {
    if (!db) return Promise.reject(new Error("Firebase não configurado"));
    return db.collection("crediti_storage").doc(docId(key, shared)).delete().then(function() {
      return { key: key, deleted: true, shared: !!shared };
    });
  },
  list: function(prefix, shared) {
    if (!db) return Promise.reject(new Error("Firebase não configurado"));
    const fullPrefix = docId(prefix || "", shared);
    return db.collection("crediti_storage")
      .where(firebase.firestore.FieldPath.documentId(), ">=", fullPrefix)
      .where(firebase.firestore.FieldPath.documentId(), "<", fullPrefix + "\uf8ff")
      .get()
      .then(function(snap) {
        const stripLen = (shared ? "shared_" : "local_").length;
        const keys = [];
        snap.forEach(function(doc) { keys.push(doc.id.slice(stripLen)); });
        return { keys: keys, prefix: prefix, shared: !!shared };
      });
  }
};
</script>

  if (v === "" || v === null || v === undefined) return 0;
  if (typeof v === "number") return v;
  const cleaned = String(v).replace(/[R$\s]/g, "").replace(/\./g, "").replace(",", ".");
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function formatBRL(v) {
  return parseNum(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function initials(name) { return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase(); }
function fmtDate(d) {
  if (!d) return "";

  if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  return d;
}
function maskDateInput(v) {
  const digits = v.replace(/\D/g, "").slice(0, 8);
  if (digits.length > 4) return digits.slice(0, 2) + "/" + digits.slice(2, 4) + "/" + digits.slice(4);
  if (digits.length > 2) return digits.slice(0, 2) + "/" + digits.slice(2);
  return digits;
}
function maskCPF(v) {
  const digits = v.replace(/\D/g, "").slice(0, 11);
  if (digits.length > 9) return digits.slice(0, 3) + "." + digits.slice(3, 6) + "." + digits.slice(6, 9) + "-" + digits.slice(9);
  if (digits.length > 6) return digits.slice(0, 3) + "." + digits.slice(3, 6) + "." + digits.slice(6);
  if (digits.length > 3) return digits.slice(0, 3) + "." + digits.slice(3);
  return digits;
}
function maskPhone(v) {
  const digits = v.replace(/\D/g, "").slice(0, 11);
  if (!digits) return "";
  const ddd = digits.slice(0, 2);
  const rest = digits.slice(2);
  let out = "(" + ddd + (digits.length > 2 ? ") " : "");
  if (rest.length > 5) out += rest.slice(0, 5) + "-" + rest.slice(5, 9);
  else out += rest;
  return out;
}
function maskCurrency(v) {
  const digits = v.replace(/\D/g, "");
  if (!digits) return "";
  const value = parseInt(digits, 10) / 100;
  return value.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function computeBaseYears() {
  const nowYear = new Date().getFullYear();
  const start = 2025;
  const end = Math.max(nowYear, 2026);
  const years = [];
  for (let y = start; y <= end; y++) years.push(y);
  return years;
}

// Records remain visible even when a registry entry is missing.
function visibleSellers(registry, data) {
  const result = DEFAULT_SELLERS.map(fixed => ({ ...fixed, ...(registry.find(s => s.id === fixed.id) || {}) }));
  registry.forEach(s => { if (!result.some(item => item.id === s.id)) result.push({ ...s }); });
  const known = new Set(result.map(s => s.id));
  Object.entries(data).forEach(([month, groups]) => {
    if (!/^(?:[0-9]|1[01])$/.test(month) || !groups || typeof groups !== "object") return;
    Object.entries(groups).forEach(([id, records]) => {
      if (!Array.isArray(records) || !records.length || known.has(id)) return;
      result.push({ id, nome: id.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ") });
      known.add(id);
    });
  });
  return result;
}

function sellersForMonth(sellers, data, year, month) {
  const period = `${year}-${month}`;
  return sellers.filter(s => DEFAULT_SELLERS.some(f => f.id === s.id)
    || ((data[month] && data[month][s.id]) || []).length > 0
    || (s.activePeriods || []).includes(period));
}

function filterClientRecords(records, query) {
  const text = query.trim();
  if (!text) return records;
  if (/^[\d.\s-]+$/.test(text)) {
    const digits = text.replace(/\D/g, "");
    return digits ? records.filter(r => String(r.cpf || "").replace(/\D/g, "").includes(digits)) : records;
  }
  const normalize = value => String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  return records.filter(r => normalize(r.cliente).includes(normalize(text)));
}

const VAULT_CONFIG = {"salt":"uM61W7n2A44opwoG6YqAtg==","iv":"MlXftSIAdwIbl0K5","data":"yjMq52By+qwW1lLHac9010tbYPCScpbJSpgp/907ro7Qfh7fsPVCyKl4Ar+y"};

async function vaultKey(password) {

  return crypto.subtle.deriveKey({name:'PBKDF2',salt:vaultBytes(VAULT_CONFIG.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

async function vaultDecrypt(key, payload, context) {

}
async function vaultEncrypt(key, value, context) {

  return {iv:vaultBase64(iv),data:vaultBase64(data)};
}
function formatCommissionCPF(value) {
  const text=String(value || '').trim();
  const digits=text.replace(/\D/g,'');
  return digits.length===11?maskCPF(digits):(text || 'Não informado');
}
function filterCommissionRows(rows,query) {

}
function sameCommissionPayload(a,b) {

}
function emptyExpenseLedger(){return {items:[],closed:false};}
function expenseTotalCents(ledger){return ledger.items.filter(item=>!item.deletedAt).reduce((sum,item)=>sum+item.cents,0);}
function expenseNature(item){return item.nature==='crediti'||item.nature==='diversas'?item.nature:'unclassified';}
function expenseNatureLabel(item){return {crediti:'Crediti',diversas:'Diversas',unclassified:'Sem natureza'}[expenseNature(item)];}
function expenseNatureGroups(ledger){

function validateExpenseDraft(draft,year,monthIdx){
  const match=String(draft.date || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!match)throw new Error('Informe a data no formato DD/MM/AAAA.');
  const [day,month,dateYear]=match.slice(1).map(Number),date=new Date(Date.UTC(dateYear,month-1,day));
  if(date.getUTCFullYear()!==dateYear || date.getUTCMonth()!==month-1 || date.getUTCDate()!==day)throw new Error('Informe uma data válida.');
  if(dateYear!==year || month!==monthIdx+1)throw new Error('A data deve pertencer à competência selecionada.');
  const name=String(draft.name || '').trim().toLocaleUpperCase('pt-BR');
  if(!name)throw new Error('Informe o nome da despesa.');
  const cents=Math.round(parseNum(draft.amount)*100);
  if(!Number.isSafeInteger(cents)||cents<=0)throw new Error('Informe um valor de despesa maior que zero.');
  if(!['crediti','diversas'].includes(draft.nature))throw new Error('Escolha a natureza da despesa: Crediti ou Diversas.');
  return {id:draft.id,date:draft.date,name,cents,nature:draft.nature};
}
function sameExpenseItem(a,b){return Boolean(a&&b)&&a.id===b.id&&a.date===b.date&&a.name===b.name&&a.cents===b.cents&&String(a.nature||'')===String(b.nature||'')&&Boolean(a.deletedAt)===Boolean(b.deletedAt);}
function applyExpenseOperation(current,operation){
  const next={...current,items:current.items.map(item=>({...item}))};
  if(operation.type==='reopen')return {...next,closed:false,reopenedAt:operation.at};
  if(current.closed)throw new Error('Esta competência está fechada. Reabra para editar as despesas.');
  if(operation.type==='close')return {...next,closed:true,closedAt:operation.at};
  const index=next.items.findIndex(item=>item.id===operation.item.id);
  if(operation.type==='add'){
    if(index!==-1)throw new Error('Essa despesa já foi salva.');
    next.items.push({...operation.item,createdAt:operation.at,updatedAt:operation.at});
  }else{
    if(index===-1||!sameExpenseItem(next.items[index],operation.original))throw new Error('Esta despesa mudou em outro aparelho. Abra a edição novamente.');
    if(operation.type==='edit')next.items[index]={...next.items[index],...operation.item,updatedAt:operation.at};
    else if(operation.type==='delete')next.items[index]={...next.items[index],deletedAt:operation.at,updatedAt:operation.at};
    else if(operation.type==='restore'){delete next.items[index].deletedAt;next.items[index].updatedAt=operation.at;}
    else throw new Error('Operação de despesa inválida.');
  }
  return next;
}
function useExpenseLedger(key,year,monthIdx,resource='expenses'){
  const scope=`${year}-${String(monthIdx+1).padStart(2,'0')}`;
  const context=`crediti-${resource}-v1:${scope}`;
  const message=text=>resource==='receipts'?text.replaceAll('despesas','receitas').replaceAll('despesa','receita'):text;
  const [snapshot,setSnapshot]=useState(null),[busy,setBusy]=useState(false),[error,setError]=useState('');
  const lock=React.useRef(false),mounted=React.useRef(true);
  useEffect(()=>{mounted.current=true;return()=>{mounted.current=false;};},[]);
  useEffect(()=>{
    if(!key)return;
    let active=true,revision=0;setSnapshot(null);setError('');
    const stop=db.collection('crediti_storage').doc('__private_'+resource+'_'+scope).onSnapshot({includeMetadataChanges:true},async snap=>{
      const version=++revision;
      if(active)setSnapshot(current=>current?.scope===scope?{...current,confirmed:false}:current);
      try{
        const payload=snap.exists?snap.data().payload:null;
        const data=payload?JSON.parse(await vaultDecrypt(key,payload,context)):emptyExpenseLedger();
        if(snap.exists&&!payload)throw new Error('invalid');
        if(!Array.isArray(data.items)||typeof data.closed!=='boolean'||data.items.some(item=>!item.id||!Number.isSafeInteger(item.cents)||item.cents<=0||typeof item.name!=='string'||typeof item.date!=='string'||(item.nature!=null&&(resource==='receipts'?typeof item.nature!=='string':!['crediti','diversas'].includes(item.nature)))))throw new Error('invalid');
        if(active&&version===revision){setSnapshot({scope,resource,data,payload,confirmed:!snap.metadata?.fromCache&&!snap.metadata?.hasPendingWrites});setError('');}
      }catch(e){if(active&&version===revision){setSnapshot(null);setError(message('Não foi possível abrir as despesas. Os dados existentes foram preservados.'));}}
    },()=>{if(active){setSnapshot(null);setError(message('Não foi possível carregar as despesas. Confira a conexão.'));}});
    return()=>{active=false;stop();};
  },[key,scope,resource]);
  const ready=Boolean(key&&snapshot?.scope===scope&&snapshot.resource===resource&&snapshot.confirmed);
  const data=snapshot?.scope===scope&&snapshot.resource===resource?snapshot.data:emptyExpenseLedger();
  async function mutate(operation){
    if(lock.current)return false;
    if(!ready){setError(message('Aguarde a confirmação das despesas pelo banco antes de salvar.'));return false;}
    lock.current=true;setBusy(true);setError('');
    const ref=db.collection('crediti_storage').doc('__private_'+resource+'_'+scope);
    const backup=db.collection('crediti_storage').doc('__private_'+resource+'_backup_'+scope+'_'+uid());
    try{
      await db.runTransaction(async tx=>{
        const snap=await tx.get(ref),payload=snap.exists?snap.data().payload:null;
        if(!sameCommissionPayload(payload,snapshot.payload))throw new Error('As despesas mudaram em outro aparelho. Aguarde a atualização e tente salvar novamente.');
        const current=payload?JSON.parse(await vaultDecrypt(key,payload,context)):emptyExpenseLedger();
        const updated=applyExpenseOperation(current,{...operation,at:new Date().toISOString()});
        const checks=ledgerIntegrityIssues(updated,resource==='receipts'?'Receitas':'Despesas');
        if(checks.length){const error=new Error(checks.join(' '));error.cashIntegrity=true;throw error;}
        const encrypted=await vaultEncrypt(key,updated,context);
        if(payload)tx.set(backup,{payload,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
        tx.set(ref,{payload:encrypted,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      });
      return true;
    }catch(e){if(mounted.current)setError(e.cashIntegrity||e.message?.includes('competência')||e.message?.includes('aparelho')||e.message?.includes('despesa')?message(e.message):'Não foi possível salvar. Confira a conexão e tente novamente.');return false;}
    finally{lock.current=false;if(mounted.current)setBusy(false);}
  }
  return {data,ready,busy,error,mutate,scope};
}

function receiptNatureLabel(item){return String(item.nature||'').trim().toLocaleUpperCase('pt-BR')||'NÃO INFORMADA';}
function receiptNatureGroups(ledger){
  const groups=new Map();
  for(const item of ledger.items.filter(item=>!item.deletedAt)){
    const label=receiptNatureLabel(item);
    if(!groups.has(label))groups.set(label,{nature:label,label,items:[],total:0});
    const group=groups.get(label);group.items.push(item);group.total+=item.cents;
  }
  return [...groups.values()].sort((a,b)=>a.label.localeCompare(b.label,'pt-BR')).map(group=>({...group,items:group.items.sort((a,b)=>a.date.split('/').reverse().join('').localeCompare(b.date.split('/').reverse().join(''))||a.name.localeCompare(b.name))}));
}
function validateReceiptDraft(draft,year,monthIdx){
  const nature=String(draft.nature||'').trim().toLocaleUpperCase('pt-BR');
  if(!nature)throw new Error('Informe a natureza da receita.');
  try{return {...validateExpenseDraft({...draft,nature:'crediti'},year,monthIdx),nature};}catch(e){throw new Error(e.message.replaceAll('despesa','receita').replace('nome da receita','descrição da receita'));}

function ledgerIntegrityIssues(ledger,label){
  const issues=[];
  if(!ledger||!Array.isArray(ledger.items))return [`Não foi possível conferir ${label}.`];
  const ids=new Set();let total=0;
  for(const item of ledger.items){
    if(item.deletedAt)continue;
    if(!item.id||ids.has(item.id))issues.push(`Há um lançamento sem identificação ou repetido em ${label}.`);
    ids.add(item.id);
    if(!Number.isSafeInteger(item.cents)||item.cents<=0)issues.push(`Confira o valor de ${item.name||'um lançamento'} em ${label}.`);
    else {total+=item.cents;if(!Number.isSafeInteger(total))issues.push(`O total de ${label} ultrapassa o limite de cálculo seguro.`);}
  }
  return [...new Set(issues)];
}
function monthlyCashReport(commissions,expenses,receipts){
  const issues=[...(commissions.issues||[]),...ledgerIntegrityIssues(expenses,'Despesas'),...ledgerIntegrityIssues(receipts,'Receitas')];
  if(!Number.isSafeInteger(commissions.creditiReceived)||commissions.creditiReceived<0)issues.push('Confira os valores das comissões Crediti recebidas.');
  if(issues.length)return {valid:false,issues:[...new Set(issues)],commissions:null,receipts:null,expenses:null,totalReceived:null,inCash:null,afterExpenses:null};
  const receiptCents=expenseTotalCents(receipts),expenseCents=expenseTotalCents(expenses);
  const totalReceived=commissions.creditiReceived+receiptCents;
  const inCash=totalReceived-expenseCents;
  if(![totalReceived,inCash].every(Number.isSafeInteger))return {valid:false,issues:['O saldo ultrapassa o limite de cálculo seguro.'],commissions:null,receipts:null,expenses:null,totalReceived:null,inCash:null,afterExpenses:null};
  return {valid:true,issues:[],commissions:commissions.creditiReceived,receipts:receiptCents,expenses:expenseCents,totalReceived,inCash,afterExpenses:inCash};
}

function commissionReceiptStatus(record,value) {
  const confirmedInOriginalRecord=Boolean(record.dataComissaoRecebida);
  return {
    extraReceived:typeof value?.extraReceived==='boolean'?value.extraReceived:confirmedInOriginalRecord,
    partnerPaid:typeof value?.partnerPaid==='boolean'?value.partnerPaid:confirmedInOriginalRecord
  };
}
function monthlyCommissionReport(yearData, monthIdx, sellers, privateValues) {
  const report={issues:[],partners:[],extraReceived:0,extraPending:0,promoterReceived:0,partnerPaid:0,partnerPending:0,crediti:0,creditiReceived:0,creditiPending:0,missing:0,count:0};
  for (const [sellerId,records] of Object.entries(yearData[monthIdx] || {})) {
    const partner={id:sellerId,name:sellers.find(s=>s.id===sellerId)?.nome || sellerId,extraReceived:0,extraPending:0,promoterReceived:0,partnerPaid:0,partnerPending:0,crediti:0,count:0};
    const seenIds=new Set();
    for (const record of records || []) {
      if(record.deletedAt)continue;
      if(!record.id||seenIds.has(record.id))report.issues.push('Há uma proposta repetida ou sem identificação. Confira os lançamentos antes de fechar o caixa.');
      seenIds.add(record.id);
      const value=privateValues[`${sellerId}:${record.id}`];
      if(value){for(const field of ['cents','promoterCents']){if((field==='cents'||value[field]!=null)&&(!Number.isSafeInteger(value[field])||value[field]<0))report.issues.push(`Confira a comissão de ${record.cliente||'uma proposta'}: há um valor inválido.`);}}
      const extra=Math.round(parseNum(record.comissaoExtra)*100),payment=Math.round(parseNum(record.comissaoParceiro)*100);
      const status=commissionReceiptStatus(record,value);
      partner[status.extraReceived?'extraReceived':'extraPending']+=extra;
      partner[status.partnerPaid?'partnerPaid':'partnerPending']+=payment;
      partner.promoterReceived+=value?.promoterCents || 0;
      partner.crediti+=value?.cents || 0;
      partner.count++;report.count++;
      if(value){report[value.received?'creditiReceived':'creditiPending']+=value.cents || 0;}else report.missing++;
    }
    if(!partner.count)continue;
    report.partners.push(partner);
    for(const field of ['extraReceived','extraPending','promoterReceived','partnerPaid','partnerPending','crediti'])report[field]+=partner[field];
  }
  report.extraTotal=report.extraReceived+report.extraPending;
  report.partnerTotal=report.partnerPaid+report.partnerPending;
  report.incomeRegistered=report.extraTotal+report.promoterReceived;
  report.income=report.extraReceived+report.promoterReceived;
  // O caixa usa somente a comissão líquida preenchida e confirmada pelo gestor.
  // Parceiros já foram descontados desse valor; não descontar novamente.
  report.balance=report.creditiReceived;
  return report;
}

  room(150);y=section(doc,'CAIXA DA CREDITI',y);
  y=table(doc,y,['Descrição','Valor'],[

  ],['COMISSÃO CREDITI CONFIRMADA',formatBRL(report.creditiReceived/100)]);
  room(190);y=section(doc,'DETALHES DOS LANÇAMENTOS',y);
  y=table(doc,y,['Comissão Crediti preenchida por você','Valor'],[
    ['Já entrou no caixa',formatBRL(report.creditiReceived/100)],

  ],['TOTAL PREENCHIDO',formatBRL(report.crediti/100)]);
  const notes=['As comissões são consideradas pelo valor Crediti marcado como recebido, já descontado o parceiro. As outras receitas aparecem no resumo final.',`Por fora ainda a receber: ${formatBRL(report.extraPending/100)}. Confira o recebimento na ficha do cliente.`,...(report.missing?[`Falta preencher a comissão Crediti de ${report.missing} proposta(s). Elas só entram no caixa após preencher o valor e confirmar o recebimento.`]:[]),'Os totais de promotora, por fora e parceiros são apresentados para consulta. Não são somados ou descontados novamente do caixa.',`Valores das ${report.count} proposta(s) desta competência. As datas dos recebimentos podem ser de outro mês.`];
  for(const note of notes){doc.setFont('helvetica','normal');doc.setFontSize(8);const lines=doc.splitTextToSize(note,doc.internal.pageSize.getWidth()-80);room(lines.length*11+6);doc.text(lines,40,y);y+=lines.length*11+6;}
  return y;
}

function extractRowsForMonth(yearData,monthIdx,sellers){
  const names=new Map(sellers.map(s=>[s.id,s.nome||s.name||'Vendedor / parceiro']));
  return Object.entries(yearData[monthIdx]||{}).flatMap(([sellerId,records])=>(Array.isArray(records)?records:[]).filter(record=>!record.deletedAt).map(record=>({key:JSON.stringify([sellerId,record.id]),sellerId,sellerName:names.get(sellerId)||'Vendedor / parceiro',record}))).sort((a,b)=>{
    const date=value=>fmtDate(value||'').split('/').reverse().join('');
    return date(a.record.data).localeCompare(date(b.record.data))||a.sellerName.localeCompare(b.sellerName,'pt-BR');
  });
}
function filterExtractRows(rows,query){
  const matches=new Set(filterClientRecords(rows.map(row=>row.record),query));
  return rows.filter(row=>matches.has(row.record));
}
function extractTotals(rows){
  const sums=rows.reduce((totals,{record})=>{for(const field of ['valorVenda','comissaoExtra','comissaoParceiro'])totals[field]+=Math.round(parseNum(record[field])*100);return totals;},{valorVenda:0,comissaoExtra:0,comissaoParceiro:0});
  return {valorVenda:sums.valorVenda/100,comissaoExtra:sums.comissaoExtra/100,comissaoParceiro:sums.comissaoParceiro/100,count:rows.length};
}

function useAppViewportAndScrollLock(locked){
  useEffect(()=>{
    const viewport=window.visualViewport,root=document.documentElement;
    let frame=0;
    const update=()=>{
      frame=0;
      const focused=document.activeElement;
      const editing=Boolean(focused?.closest('.app-overlay')&&focused.matches('input:not([type=checkbox]):not([type=radio]),textarea,select'));
      const visibleHeight=viewport?.height||window.innerHeight;
      const layoutHeight=Math.max(window.innerHeight,root.clientHeight);
      const keyboardOpen=editing&&Math.abs((viewport?.scale||1)-1)<0.01&&layoutHeight-visibleHeight>120;
      // Browser toolbars and elastic scrolling must not move the sheet.
      const height=keyboardOpen?`${Math.round(visibleHeight)}px`:'100svh';
      const top=keyboardOpen?`${Math.max(0,Math.round(viewport?.offsetTop||0))}px`:'0px';
      if(root.style.getPropertyValue('--app-visible-height')!==height)root.style.setProperty('--app-visible-height',height);
      if(root.style.getPropertyValue('--app-visible-top')!==top)root.style.setProperty('--app-visible-top',top);
    };
    const schedule=()=>{if(!frame)frame=requestAnimationFrame(update);};
    update();window.addEventListener('resize',schedule);viewport?.addEventListener('resize',schedule);viewport?.addEventListener('scroll',schedule);document.addEventListener('focusin',schedule);document.addEventListener('focusout',schedule);
    return()=>{if(frame)cancelAnimationFrame(frame);window.removeEventListener('resize',schedule);viewport?.removeEventListener('resize',schedule);viewport?.removeEventListener('scroll',schedule);document.removeEventListener('focusin',schedule);document.removeEventListener('focusout',schedule);};
  },[]);
  useEffect(()=>{
    if(!locked)return;
    const body=document.body,scrollY=window.scrollY;
    const previous={position:body.style.position,top:body.style.top,width:body.style.width,overflow:body.style.overflow};
    body.style.position='fixed';body.style.top=`-${scrollY}px`;body.style.width='100%';body.style.overflow='hidden';
    return()=>{Object.assign(body.style,previous);window.scrollTo({top:scrollY,left:0,behavior:'instant'});};
  },[locked]);
}

  async function mutateStored(key, fallback, change) {
    if (writeLock.current) return false;
    writeLock.current = true; setSaving(true); setError(""); setSaveNotice("");
    try {
      const ref = db.collection("crediti_storage").doc(docId(key, true));
      const backupRef = db.collection("crediti_storage").doc(docId("crediti-backup-" + key + "-" + Date.now() + "-" + uid(), true));
      const operationTime = new Date().toISOString();
      await db.runTransaction(async tx => {
        const snap = await tx.get(ref);
        const current = snap.exists ? JSON.parse(snap.data().value) : fallback;
        const updated = change(current);
        // A separate snapshot is committed atomically with the change.
        // If the backup cannot be saved, the production change also fails.
        tx.set(backupRef, {
          value: snap.exists ? snap.data().value : JSON.stringify(fallback),
          sourceKey: key, createdAt: operationTime, sellers: JSON.stringify(sellers)
        });
        tx.set(ref, {
          value: JSON.stringify(updated),
          previousValue: snap.exists ? snap.data().value : JSON.stringify(fallback),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          storageVersion: 2
        }, { merge: true });
      });
      setSaveNotice("Salvo no banco com cópia de segurança.");
      return true;
    } catch (e) {
      setError(e.message && e.message.startsWith("Atenção:") ? e.message : "Não foi salvo. Seus dados continuam no formulário. Confira a internet e tente novamente.");
      return false;
    } finally { writeLock.current = false; setSaving(false); }
  }

  function sellerTotalsForMonth(sellerId, mIdx) {
    const recs = (yearData[mIdx] && yearData[mIdx][sellerId]) || [];
    return recs.reduce((acc, r) => {
      acc.valorVenda += parseNum(r.valorVenda);
      acc.comissaoParceiro += parseNum(r.comissaoParceiro);
      acc.comissaoExtra += parseNum(r.comissaoExtra);
      acc.count += 1;
      return acc;
    }, { valorVenda: 0, comissaoParceiro: 0, comissaoExtra: 0, count: 0 });
  }

  const monthRecords = useMemo(() => (activeSellerId && yearData[monthIdx] && yearData[monthIdx][activeSellerId]) || [], [yearData, monthIdx, activeSellerId]);
  const monthSummary = useMemo(() => monthSellers.map(s => ({ seller: s, totals: sellerTotalsForMonth(s.id, monthIdx) })), [monthSellers, yearData, monthIdx]);
  const monthGrandTotal = useMemo(() => monthSummary.reduce((acc, s) => {
    acc.valorVenda += s.totals.valorVenda; acc.comissaoParceiro += s.totals.comissaoParceiro;
    acc.comissaoExtra += s.totals.comissaoExtra; acc.count += s.totals.count;
    return acc;
  }, { valorVenda: 0, comissaoParceiro: 0, comissaoExtra: 0, count: 0 }), [monthSummary]);

  function monthProductSummary() {
    const map = {};
    sellers.forEach(s => {
      const recs = (yearData[monthIdx] && yearData[monthIdx][s.id]) || [];
      recs.forEach(r => {
        const key = (r.produto || "").trim() || "Não informado";
        if (!map[key]) map[key] = { produto: key, valorVenda: 0, count: 0 };
        map[key].valorVenda += parseNum(r.valorVenda);
        map[key].count += 1;
      });
    });
    return Object.values(map).sort((a, b) => b.valorVenda - a.valorVenda);
  }

  function annualProductSummary() {
    const map = {};
    for (let mIdx = 0; mIdx < 12; mIdx++) {
      const monthData = yearData[mIdx] || {};
      sellers.forEach(s => {
        const recs = monthData[s.id] || [];
        recs.forEach(r => {
          const key = (r.produto || "").trim() || "Não informado";
          if (!map[key]) map[key] = { produto: key, valorVenda: 0, count: 0 };
          map[key].valorVenda += parseNum(r.valorVenda);
          map[key].count += 1;
        });
      });
    }
    return Object.values(map).sort((a, b) => b.valorVenda - a.valorVenda);
  }

  function annualSummary() {
    const perSeller = sellers.map(s => ({ seller: s, valorVenda: 0, comissao: 0, recebidoValor: 0, pendenteValor: 0, count: 0 }));
    const perSellerMap = {};
    perSeller.forEach(p => { perSellerMap[p.seller.id] = p; });
    const perMonth = MESES.map((m, i) => ({ idx: i, nome: m, valorVenda: 0, count: 0 }));
    const totals = { valorVenda: 0, comissao: 0, recebidoValor: 0, pendenteValor: 0, count: 0 };
    for (let mIdx = 0; mIdx < 12; mIdx++) {
      const monthData = yearData[mIdx] || {};
      sellers.forEach(s => {
        const recs = monthData[s.id] || [];
        recs.forEach(r => {
          const venda = parseNum(r.valorVenda);
          const com = parseNum(r.comissaoParceiro) + parseNum(r.comissaoExtra);
          const p = perSellerMap[s.id];
          p.valorVenda += venda; p.comissao += com; p.count += 1;
          if (r.dataRecebimento) p.recebidoValor += venda; else p.pendenteValor += venda;
          perMonth[mIdx].valorVenda += venda; perMonth[mIdx].count += 1;
          totals.valorVenda += venda; totals.comissao += com; totals.count += 1;
          if (r.dataRecebimento) totals.recebidoValor += venda; else totals.pendenteValor += venda;
        });
      });
    }
    return { perSeller: perSeller.filter(p => p.count > 0 || DEFAULT_SELLERS.some(f => f.id === p.seller.id)), perMonth, totals };
  }

  async function saveRecord() {
    if (!dataReady || loading || !sellersReady) { setError("Aguarde o carregamento completo dos dados antes de salvar."); return; }
    if (!form.cliente.trim()) { setError("Informe o nome do cliente."); return; }

    const original = monthRecords.find(r => r.id === editingRecord);

      if (!current || Array.isArray(current) || typeof current !== "object") throw new Error("invalid");
      const updated = JSON.parse(JSON.stringify(current));
      if (!updated[monthIdx]) updated[monthIdx] = {};
      const records = updated[monthIdx][activeSellerId] || [];
      const existing = records.find(r => r.id === record.id);
      if (editingRecord && (!existing || JSON.stringify(existing) !== JSON.stringify(original))) {
        throw new Error("Atenção: esta produção foi alterada em outro aparelho. Feche e abra a edição novamente.");
      }
      updated[monthIdx][activeSellerId] = editingRecord
        ? records.map(r => r.id === record.id ? record : r)
        : [...records, record];
      return updated;
    });
    if (ok) { setModalOpen(false); setEditingRecord(null); }
  }

  async function deleteRecord(id) {
    if (!dataReady || loading) { setError("Aguarde o carregamento dos dados."); return; }
    const original = monthRecords.find(r => r.id === id);
    const ok = await mutateStored(`crediti-records-${year}`, {}, current => {
      const updated = JSON.parse(JSON.stringify(current));
      const records = (updated[monthIdx] && updated[monthIdx][activeSellerId]) || [];
      const existing = records.find(r => r.id === id);
      if (!existing || JSON.stringify(existing) !== JSON.stringify(original)) {
        throw new Error("Atenção: esta produção foi alterada. Confira os dados antes de excluir.");
      }
      // Preserve deleted records in the same document for recovery.
      if (!updated._archive) updated._archive = {};
      updated._archive[id] = { record: existing, month: monthIdx, sellerId: activeSellerId, deletedAt: new Date().toISOString() };
      updated[monthIdx][activeSellerId] = records.filter(r => r.id !== id);
      return updated;
    });
    if (ok) setConfirmDelete(null);
  }

  async function addSeller() {
    const name = newSellerName.trim();
    if (!name || !sellersReady) return;
    const id = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || uid();
    const ok = await mutateStored("crediti-sellers", DEFAULT_SELLERS, current => {
      if (!Array.isArray(current)) throw new Error("invalid");
      const period = `${year}-${monthIdx}`;
      if (current.some(s => s.id === id)) return current.map(s => s.id === id ? { ...s, activePeriods: Array.from(new Set([...(s.activePeriods || []), period])) } : s);
      return [...current, { id, nome: name, activePeriods: [period] }];
    });
    if (ok) { setNewSellerName(""); setAddingSeller(false); }
  }

  async function restoreRecord(id) {
    if (!dataReady || loading) return;
    await mutateStored(`crediti-records-${year}`, {}, current => {
      const item = current._archive && current._archive[id];
      if (!item || !item.record) throw new Error("Atenção: este registro já foi recuperado.");
      const updated = JSON.parse(JSON.stringify(current));
      const records = (updated[item.month] && updated[item.month][item.sellerId]) || [];
      if (records.some(r => r.id === id)) throw new Error("Atenção: esta produção já está ativa.");
      if (!updated[item.month]) updated[item.month] = {};
      updated[item.month][item.sellerId] = [...records, item.record];
      delete updated._archive[id];
      return updated;
    });
  }

    link.href = url; link.download = name; link.click();

            <div className="bg-[#17160F] rounded-2xl p-4 sm:p-5">
              <div className="text-[10.5px] font-bold text-[#FFD447] uppercase tracking-wider mb-2">Total geral do mês</div>
              <div className="mobile-stats grid grid-cols-3 gap-3">
                <div>
                  <div className="text-[10px] text-white/40 uppercase tracking-wide mb-0.5">Produção</div>
                  <div className="num font-extrabold text-white text-[15px] sm:text-[17px]">{formatBRL(monthGrandTotal.valorVenda)}</div>
                </div>
                <div>
                  <div className="text-[10px] text-white/40 uppercase tracking-wide mb-0.5">Com. por fora</div>
                  <div className="num font-extrabold text-white text-[15px] sm:text-[17px]">{formatBRL(monthGrandTotal.comissaoExtra)}</div>
                </div>
                <div>
                  <div className="text-[10px] text-white/40 uppercase tracking-wide mb-0.5">Com. parceiro</div>
                  <div className="num font-extrabold text-white text-[15px] sm:text-[17px]">{formatBRL(monthGrandTotal.comissaoParceiro)}</div>
                </div>
              </div>
            </div>
          </>
        )}
      </div>

      {/* ===== Bottom nav (mobile, bank-app style) ===== */}
      <nav className="app-bottom-nav sm:hidden fixed bottom-0 inset-x-0 z-30 bg-[#FFFBEE]/95 backdrop-blur border-t border-[#EFE2A8] flex items-stretch">
        <NavBtn icon={<Home size={18} />} label="Início" active={screen === "home"} onClick={() => setScreen("home")} />
        <NavBtn icon={<LayoutList size={18} />} label="Extrato" active={screen === "extract" || screen === "seller"} onClick={() => {setClientSearch('');setConfirmDelete(null);setScreen('extract');}} />
        <NavBtn icon={<PiggyBank size={18} />} label="Resumo" active={screen === "resumo"} onClick={() => setScreen("resumo")} />
      </nav>

      {/* ===== Modal ===== */}
      {modalOpen && (
        <div role="dialog" aria-modal="true" aria-labelledby="record-modal-title" className="app-overlay fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50" onClick={() => setModalOpen(false)}>
          <div className="modal-panel record-modal bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg" onClick={e => e.stopPropagation()}>
            <div className="record-modal-header border-b border-[#F0EAC8] flex justify-between bg-white">
              <div id="record-modal-title" className="font-extrabold text-[15px] text-[#17160F]">{editingRecord ? "Editar lançamento" : "Novo lançamento"} — {activeSeller?.nome}</div>
              <button type="button" aria-label="Fechar ficha" onClick={() => setModalOpen(false)} className="w-8 h-8 rounded-full hover:bg-[#F5EDCB] flex items-center justify-center"><X size={16} /></button>
            </div>
            <div className="record-modal-scroll space-y-3.5" tabIndex="0" aria-label="Campos do lançamento">
              <div className="grid grid-cols-2 gap-4 sm:gap-5">
                <Field label="Data da venda">
                  <input
                    type="text" inputMode="numeric" maxLength={10}
                    value={form.data}
                    onChange={e => setForm({ ...form, data: maskDateInput(e.target.value) })}
                    className="input" placeholder="dd/mm/aaaa"
                  />
                </Field>
                <Field label="Cliente recebeu em">
                  <input
                    type="text" inputMode="numeric" maxLength={10}
                    value={form.dataRecebimento}
                    onChange={e => setForm({ ...form, dataRecebimento: maskDateInput(e.target.value) })}
                    className="input" placeholder="dd/mm/aaaa"
                  />
                </Field>
              </div>
              <Field label="Nome do cliente"><input value={form.cliente} onChange={e => setForm({ ...form, cliente: e.target.value })} className="input" placeholder="Ex: José da Silva" /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="CPF"><input value={form.cpf} onChange={e => setForm({ ...form, cpf: maskCPF(e.target.value) })} className="input" placeholder="000.000.000-00" inputMode="numeric" /></Field>
                <Field label="Telefone"><input value={form.telefone} onChange={e => setForm({ ...form, telefone: maskPhone(e.target.value) })} className="input" placeholder="(85) 99000-0000" inputMode="numeric" /></Field>
              </div>
              <Field label="Telefone é de quem? (se não for do cliente)"><input value={form.telefoneTitular} onChange={e => setForm({ ...form, telefoneTitular: e.target.value })} className="input" placeholder="Ex: filha — Maria" /></Field>
              <Field label="Produto"><input value={form.produto} onChange={e => setForm({ ...form, produto: e.target.value })} className="input" placeholder="Ex: Consignado INSS" /></Field>
              <div className="mobile-stats grid grid-cols-3 gap-3">
                <Field label="Valor da venda"><input value={form.valorVenda} onChange={e => setForm({ ...form, valorVenda: maskCurrency(e.target.value) })} className="input" placeholder="R$ 0,00" inputMode="numeric" /></Field>
                <Field label="Com. por fora"><input value={form.comissaoExtra} onChange={e => setForm({ ...form, comissaoExtra: maskCurrency(e.target.value) })} className="input" placeholder="R$ 0,00" inputMode="numeric" /></Field>
                <Field label="Com. parceiro"><input value={form.comissaoParceiro} onChange={e => setForm({ ...form, comissaoParceiro: maskCurrency(e.target.value) })} className="input" placeholder="R$ 0,00" inputMode="numeric" /></Field>
              </div>
              <Field label="Vendedor recebeu a comissão em">
                <input
                  type="text" inputMode="numeric" maxLength={10}
                  value={form.dataComissaoRecebida}
                  onChange={e => setForm({ ...form, dataComissaoRecebida: maskDateInput(e.target.value) })}
                  className="input" placeholder="dd/mm/aaaa — deixe em branco se ainda não recebeu"
                />
              </Field>
              <Field label="Observações"><textarea value={form.observacoes} onChange={e => setForm({ ...form, observacoes: e.target.value })} className="input min-h-[70px] resize-none" placeholder="Anotações adicionais..." /></Field>
            </div>
            <div className="record-modal-footer border-t border-[#F0EAC8] flex items-center justify-end bg-white">
              <button onClick={() => setModalOpen(false)} className="px-4 py-2 rounded-lg text-[13px] font-bold text-[#7A7154] hover:bg-[#F5EDCB] transition">Cancelar</button>
              <button disabled={saving || loading || !dataReady || !sellersReady} onClick={saveRecord} className="px-4 py-2 rounded-lg text-[13px] font-bold bg-[#FFD447] text-[#17160F] hover:bg-[#f0c62f] transition flex items-center gap-1.5"><Save size={14} /> Salvar</button>
            </div>
          </div>
        </div>
      )}

      <footer className="hidden sm:block text-center text-[11px] text-[#B8AF87] pt-8 pb-4">Crediti Soluções Financeiras · dados salvos automaticamente na nuvem</footer>
    </div>
  );
}

function StatCard({ label, value, strong }) {
  return (
    <div className="bg-white rounded-xl border border-[#EFE2A8] px-3 py-2.5">
      <div className="text-[9.5px] font-bold text-[#8A7A1F] uppercase tracking-wide">{label}</div>
      <div className={`num text-[13px] sm:text-[14px] mt-0.5 truncate ${strong ? "font-extrabold text-[#17160F]" : "font-semibold text-[#4A4636]"}`}>{value}</div>
    </div>
  );
}

function NavBtn({ icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 ${active ? "text-[#17160F]" : "text-[#B8AF87]"}`}>
      <span className={`w-9 h-6 rounded-full flex items-center justify-center transition ${active ? "bg-[#FFD447]" : ""}`}>{icon}</span>
      <span className="text-[10px] font-bold">{label}</span>
    </button>
  );
}

function Field({ label, children }) {
  return (
    <label className="block">
      <span className="block text-[10.5px] font-bold text-[#8A7A1F] mb-1 uppercase tracking-wide">{label}</span>
      {children}
    </label>
  );
}

function SetupNeeded() {
  return React.createElement("div", {
    style: { fontFamily: "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif", minHeight: "100vh", background: "#FFF7DC", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }
  }, React.createElement("div", {
    style: { background: "#fff", borderRadius: 16, padding: 28, maxWidth: 480, border: "1px solid #EFE2A8", boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }
  },
    React.createElement("div", { style: { fontSize: 18, fontWeight: 800, color: "#17160F", marginBottom: 10 } }, "Falta configurar o Firebase"),
    React.createElement("div", { style: { fontSize: 13.5, color: "#4A4636", lineHeight: 1.6 } },
      "Abra o arquivo HTML num editor de texto, procure por FIREBASE_CONFIG no topo, e cole ali os dados do seu projeto Firebase (apiKey, projectId, etc). Depois salve e publique de novo no Netlify."
    )
  ));
}

const root = ReactDOM.createRoot(document.getElementById("root"));
if (window.__FIREBASE_NOT_CONFIGURED__) {
  root.render(React.createElement(SetupNeeded));
} else {
  root.render(React.createElement(CreditiProducao));
}
</script>
</body>
</html>
